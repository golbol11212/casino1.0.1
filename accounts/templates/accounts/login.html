{% extends 'pages/base.html' %}

{% block title %}Login - Godsait Casino{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-form-container">
        <div class="auth-header">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to continue your adventure</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger">
            Invalid username or password.
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" id="id_username" class="form-control" placeholder=" " required>
                <label for="id_username" data-text="Username">Username</label>
            </div>
            <div class="form-group">
                <input type="password" name="password" id="id_password" class="form-control" placeholder=" " required>
                <label for="id_password" data-text="Password">Password</label>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-text="Login">
                <span class="btn-text">Login</span>
            </button>
        </form>

        <p class="auth-link">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</div>
{% endblock %}
