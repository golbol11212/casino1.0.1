{% extends 'pages/base.html' %}
{% load static %}

{% block title %}Gold Case{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'game/css/case.css' %}?v={% now "U" %}">
{% endblock %}

{% block content %}
<div class="main-wrapper theme-gold" data-case-type="gold" data-case-cost="2000.00">
    <nav class="case-nav">
        <a href="{% url 'case_bronze' %}">Bronze Case</a>
        <a href="{% url 'case_silver' %}">Silver Case</a>
        <a href="{% url 'case_gold' %}" class="active">Gold Case</a>
    </nav>
    <div id="cases-area">
        <!-- Сюда будут добавляться рулетки через JS -->
    </div>
    <div class="balance-info">
        <p>Основной баланс: <span id="main-balance">0.00</span></p>
    </div>
    <div class="controls-container">
        <label for="case-amount">Количество:</label>
        <input type="number" id="case-amount" value="1" min="1" max="10">
    </div>
    <button id="open-case-btn">Открыть кейс</button>
    <div id="total-winnings-text"></div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'game/js/case.js' %}?v={% now "U" %}"></script>
{% endblock %}
