{% extends 'pages/base.html' %}
{% load static %}

{% block title %}Javascript Roulette{% endblock %}

{% block styles %}
    <link href="{% static 'pages/css/style.css' %}?v=2.8" rel="stylesheet" type="text/css">
	<link href="{% static 'game/css/roulette.css' %}?v=2.8" rel="stylesheet" type="text/css">
{% endblock %}
{% block scripts %}
	<script src="{% static 'game/js/roulette.js' %}?v=2.8"></script>
{% endblock %}


{% block content %}
    <div id="roulette-app">
        <!-- Content will be generated by JS -->
        <div id="initial-balance" data-balance="{{ request.session.balance|default:'0' }}" style="display: none;"></div>
    </div>
{% endblock %}
<form id="back-form" method="post" action="/game/update_redirect/" style="display: none;">
    {% csrf_token %}
    <input type="hidden" name="balance" id="balance-input">
</form>
