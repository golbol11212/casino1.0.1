<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bronze Case</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-bronze">
    <div class="main-wrapper">
        <header class="app-header">
            <h1>Bronze Case</h1>
            <div class="header-controls">
                <div class="balance-container">
                    <h2>Баланс: <span id="balance">10000</span></h2>
                </div>
                <button id="exit-btn">Выход</button>
            </div>
        </header>
        <nav class="case-nav">
            <a href="bronze.html" class="active">Bronze Case</a>
            <a href="index.html">Silver Case</a>
            <a href="gold.html">Gold Case</a>
        </nav>
        <div id="cases-area">
            <!-- Сюда будут добавляться рулетки через JS -->
        </div>
        <div class="controls-container">
            <label for="case-amount">Количество:</label>
            <input type="number" id="case-amount" value="1" min="1" max="10">
        </div>
        <button id="open-case-btn">Открыть кейс</button>
        <div id="total-winnings-text"></div>
    </div>
    <script src="bronze.js"></script>
</body>
</html>
