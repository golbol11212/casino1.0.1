<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Casino "Fortune"</h1>
        <div class="player-stats">
            <div class="balance">Balance: <span id="balance-amount">100</span></div>
        </div>
        <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">🍋</div>
                <div class="reel" id="reel3">🍊</div>
            </div>
            <div class="bet-controls">
                <button id="decrease-bet">-</button>
                <div class="bet">Bet: <span id="bet-amount">10</span></div>
                <button id="increase-bet">+</button>
            </div>
            <button id="spinButton">Spin</button>
        </div>
        <div id="result"></div>
        <div class="pay-table">
            <h2>Winning Combinations & Payouts</h2>
            <p>🍒 + 🍒 + 🍒 = 2x Bet</p>
            <p>🍋 + 🍋 + 🍋 = 2x Bet</p>
            <p>🍊 + 🍊 + 🍊 = 2x Bet</p>
            <p>🍇 + 🍇 + 🍇 = 5x Bet</p>
            <p>🍉 + 🍉 + 🍉 = 5x Bet</p>
            <p>🔔 + 🔔 + 🔔 = 10x Bet</p>
            <p>⭐ + ⭐ + ⭐ = 50x Bet (JACKPOT!)</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
