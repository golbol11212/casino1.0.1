{% extends 'pages/base.html' %}
{% load static %}

{% block title %}Mobile Payment - Alkatraz Casino{% endblock %}

{% block content %}
<section class="hero-v2">
    <div class="hero-v2-content">
        <h1 class="hero-v2-title" data-text="МОБІЛЬНІ ПЛАТЕЖІ">МОБІЛЬНІ ПЛАТЕЖІ</h1>
        <p class="hero-v2-subtitle">Здійсніть донат за допомогою мобільного телефону.</p>
    </div>
</section>

<section class="auth-container">
    <div class="auth-form-container">
        <div class="auth-header">
            <h2 class="auth-title">Мобільний донат</h2>
            <p class="auth-subtitle">Будь ласка, введіть номер телефону та суму.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="tel" id="phone_number" name="phone_number" class="form-control" placeholder=" " required pattern="[0-9]{10,15}" title="Будь ласка, введіть дійсний номер телефону">
                <label for="phone_number" data-text="Номер телефону">Номер телефону</label>
            </div>
            <div class="form-group">
                <input type="number" id="amount" name="amount" class="form-control" placeholder=" " required min="1" step="0.01" title="Будь ласка, введіть суму донату">
                <label for="amount" data-text="Сума донату">Сума донату</label>
            </div>
            <button type="submit" class="btn btn-primary btn-block submit-btn" data-text="Зробити донат"><span class="btn-text">Зробити донат</span></button>
        </form>
    </div>
</section>
{% endblock %}
